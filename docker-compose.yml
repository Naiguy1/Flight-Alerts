services:
  flight_worker:
    build: .
    container_name: flight_worker
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////app/data/flight_deals.db
      - CONFIG_PATH=/app/config.yaml
      - TZ=America/Denver
    volumes:
      - /home/bowerbank-admin/flight-alerter/data:/app/data
      - /home/bowerbank-admin/flight-alerter/config.yaml:/app/config.yaml
    command: ["python", "main.py", "--config", "/app/config.yaml"]
    networks:
      - flight_internal
    deploy:
      resources:
        limits:
          memory: 512M

  flight_web:
    build: .
    container_name: flight_web
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////app/data/flight_deals.db
      - CONFIG_PATH=/app/config.yaml
      - TZ=America/Denver
    volumes:
      - /home/bowerbank-admin/flight-alerter/data:/app/data
      - /home/bowerbank-admin/flight-alerter/config.yaml:/app/config.yaml
    command: ["uvicorn", "dashboard:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    expose:
      - "8000"
    networks:
      - flight_internal
      - jellyfin_default
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  flight_internal:
    driver: bridge
  jellyfin_default:
    external: true
