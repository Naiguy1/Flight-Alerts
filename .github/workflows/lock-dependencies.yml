name: Resolve dependency locks
on:
  workflow_dispatch:
  push:
    branches: [production-hardening]
    paths:
      - 'requirements*.in'
      - 'tools/lock_dependencies.py'
      - '.github/workflows/lock-dependencies.yml'
      - 'tools/publish_dependency_locks.py'
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve production and test environments
        run: python -m tools.lock_dependencies --scraper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-locks
          path: requirements*.txt
          retention-days: 7
      - name: Publish generated locks on trusted branch push only
        if: github.event_name == 'push' && github.ref == 'refs/heads/production-hardening' && github.repository == 'Naiguy1/Flight-Alerts'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.publish_dependency_locks
