name: Supplement platform wheel hashes
on:
  workflow_dispatch:
  push:
    branches: [production-hardening]
    paths:
      - tools/add_platform_hashes.py
      - .github/workflows/supplement-platform-hashes.yml
permissions:
  contents: read
jobs:
  supplement:
    if: github.repository == 'Naiguy1/Flight-Alerts' && github.ref == 'refs/heads/production-hardening' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve actual compatible wheels for existing pins
        run: python -m tools.add_platform_hashes
      - name: Publish dependency locks for maintainer retrieval and review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.add_platform_hashes --publish-existing
