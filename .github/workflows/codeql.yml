name: CodeQL
on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 7 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: /language:python
          output: codeql-results
      - name: Enforce high and critical CodeQL release gate
        run: python3 -m tools.ci_codeql_report codeql-results
      - name: Publish connector-readable validation diagnostics
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ job.status }}
        run: python3 -m tools.publish_validation_report CodeQL
