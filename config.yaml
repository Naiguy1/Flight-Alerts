# Public bootstrap defaults. Mutable settings and verified recipients live in SQLite.
scanner:
  origins:
  - SLC
  - LAS
  scan_interval_hours: 6
  request_delay_seconds: 2.5
  search_window:
    min_days_ahead: 30
    max_days_ahead: 180
    sample_departure_offsets_days:
    - 35
    - 65
    - 95
    - 130
    - 165
    trip_duration_days: 7
  currency: USD
  provider_requests_per_minute: 10
  provider_daily_budget: 1000
  concurrency: 3
  request_timeout_seconds: 20
  scan_deadline_seconds: 7200
filters:
  discount_threshold_percent: 50.0
  deduplication_window_hours: 48
  min_historical_samples_for_db_avg: 15
  excluded_country_codes:
  - US
  allowed_domestic_airports:
  - BOS
  - MCO
  - TPA
  - RSW
  - SDF
  - LEX
  - CVG
  - SJU
  - STT
  - HNL
  blocked_destinations: []
  recipient_emails: []
  alerts_paused: false
  price_improvement_usd: 35
  price_improvement_percent: 10
  freshness_hours: 24
  retention_days: 180
  digest_enabled: false
  digest_interval_hours: 6
  quiet_hours: null
