[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:flight_alerts.*"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".git", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["analyzer", "db", "fetcher", "notifier", "services", "web", "dashboard", "settings"]
